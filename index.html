<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#d32f2f">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
<title>大乐透 · 分析 / 预测 整合版</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.svg">
<style>
/* 主题色板：浅色为默认，深色根据系统 prefers-color-scheme 自动切换 */
:root {
  color-scheme: light dark;
  --bg: #f0f2f5;
  --text: #333;
  --panel: #fff;
  --border: #e0e0e0;
  --shadow: rgba(0,0,0,0.08);
  --btn-color: #666;
  --btn-hover-bg: #fce4e4;
  --btn-hover-color: #d32f2f;
  --accent: #d32f2f;
  --btn-active-color: #fff;
  --loading-color: #999;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121212;
    --text: #e0e0e0;
    --panel: #1e1e1e;
    --border: #333;
    --shadow: rgba(0,0,0,0.5);
    --btn-color: #a0a0a0;
    --btn-hover-bg: rgba(211,47,47,0.16);
    --btn-hover-color: #ff6b6b;
    --accent: #e53935;
    --btn-active-color: #fff;
    --loading-color: #aaa;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100vh; height: 100dvh; overflow: hidden; }
body {
  display: flex; flex-direction: column;
  font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px;
  -webkit-tap-highlight-color: transparent;
}

/* ===== 顶部标题切换条 ===== */
.switcher {
  flex: 0 0 auto;
  display: flex;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 4px var(--shadow);
}
.switcher-btn {
  flex: 1;
  padding: 14px 12px;
  border: none; cursor: pointer;
  background: transparent;
  font-size: 16px; font-weight: 600;
  color: var(--btn-color);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .2s;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.switcher-btn:hover { background: var(--btn-hover-bg); color: var(--btn-hover-color); }
.switcher-btn.active { background: var(--accent); color: var(--btn-active-color); }
.switcher-btn .badge { font-size: 11px; font-weight: 400; opacity: .85; }

/* ===== 内容区（iframe）===== */
.view { position: relative; flex: 1 1 auto; min-height: 0; display: none; overflow: hidden; }
.view.active { display: block; }
.view iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--panel); }

/* 加载提示 */
.view .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--loading-color); font-size: 14px; }
</style>
</head>
<body>

<nav class="switcher">
  <button class="switcher-btn" data-tab="fenxi" id="btn-fenxi">
    📊 大乐透历史分析
    <span class="badge">分析</span>
  </button>
  <button class="switcher-btn" data-tab="yuce" id="btn-yuce">
    🏆 大乐透预测工具
    <span class="badge">预测</span>
  </button>
</nav>

<div class="view" id="view-fenxi" data-tab="fenxi">
  <div class="loading">加载中…</div>
  <iframe src="https://daletou-fenxi.pages.dev" title="大乐透历史走势分析表" loading="eager"></iframe>
</div>
<div class="view" id="view-yuce" data-tab="yuce">
  <div class="loading">加载中…</div>
  <iframe src="https://daletou-yuce.pages.dev" title="大乐透预测工具" loading="eager"></iframe>
</div>

<script>
(function () {
  var btns = document.querySelectorAll('.switcher-btn');
  var views = document.querySelectorAll('.view');

  function show(tab) {
    var activeTab = tab === 'yuce' ? 'yuce' : 'fenxi';
    btns.forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === activeTab);
    });
    views.forEach(function (v) {
      v.classList.toggle('active', v.dataset.tab === activeTab);
    });
    // 记录到 hash，刷新后保持当前标签
    if (window.location.hash !== activeTab) {
      history.replaceState(null, '', '#' + activeTab);
    }
  }

  // 点击切换
  btns.forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.tab); });
  });

  // 初始显示：优先取 hash
  var initial = (window.location.hash || '').replace('#', '');
  show(initial === 'yuce' ? 'yuce' : 'fenxi');

  // 隐藏 iframe 上的加载占位（iframe 加载完成后移除）
  views.forEach(function (v) {
    var frame = v.querySelector('iframe');
    var loading = v.querySelector('.loading');
    frame.addEventListener('load', function () { if (loading) loading.style.display = 'none'; });
  });
})();
</script>
</body>
</html>
