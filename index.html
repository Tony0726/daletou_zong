<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>大乐透 · 分析 / 预测 整合版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif; background: #f0f2f5; color: #333; font-size: 14px; -webkit-tap-highlight-color: transparent; }

/* ===== 顶部标题切换条 ===== */
.switcher {
  position: sticky; top: 0; z-index: 1000;
  display: flex;
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.switcher-btn {
  flex: 1;
  padding: 14px 12px;
  border: none; cursor: pointer;
  background: transparent;
  font-size: 16px; font-weight: 600;
  color: #666;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .2s;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.switcher-btn:hover { background: #fce4e4; color: #d32f2f; }
.switcher-btn.active { background: #d32f2f; color: #fff; }
.switcher-btn .badge { font-size: 11px; font-weight: 400; opacity: .85; }

/* ===== 内容区（iframe）===== */
.view { display: none; height: calc(100vh - 49px); height: calc(100dvh - 49px); }
.view.active { display: block; }
.view iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

/* 加载提示 */
.view .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #999; font-size: 14px; }
</style>
</head>
<body>

<nav class="switcher">
  <button class="switcher-btn" data-tab="fenxi" id="btn-fenxi">
    📊 大乐透历史走势分析表
    <span class="badge">分析</span>
  </button>
  <button class="switcher-btn" data-tab="yuce" id="btn-yuce">
    🏆 大乐透预测工具
    <span class="badge">预测</span>
  </button>
</nav>

<div class="view" id="view-fenxi" data-tab="fenxi">
  <div class="loading">加载中…</div>
  <iframe src="fenxi/index.html" title="大乐透历史走势分析表" loading="eager"></iframe>
</div>
<div class="view" id="view-yuce" data-tab="yuce">
  <div class="loading">加载中…</div>
  <iframe src="yuce/index.html" title="大乐透预测工具" loading="eager"></iframe>
</div>

<script>
(function () {
  var btns = document.querySelectorAll('.switcher-btn');
  var views = document.querySelectorAll('.view');

  function show(tab) {
    var activeTab = tab === 'yuce' ? 'yuce' : 'fenxi';
    btns.forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === activeTab);
    });
    views.forEach(function (v) {
      v.classList.toggle('active', v.dataset.tab === activeTab);
    });
    // 记录到 hash，刷新后保持当前标签
    if (window.location.hash !== activeTab) {
      history.replaceState(null, '', '#' + activeTab);
    }
  }

  // 点击切换
  btns.forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.tab); });
  });

  // 初始显示：优先取 hash
  var initial = (window.location.hash || '').replace('#', '');
  show(initial === 'yuce' ? 'yuce' : 'fenxi');

  // 隐藏 iframe 上的加载占位（iframe 加载完成后移除）
  views.forEach(function (v) {
    var frame = v.querySelector('iframe');
    var loading = v.querySelector('.loading');
    frame.addEventListener('load', function () { if (loading) loading.style.display = 'none'; });
  });
})();
</script>
</body>
</html>
